#
# WCCKIT viewer-side Intel PCM bridge.
#
# This follows Intel PCM's Grafana architecture: pcm-sensor-server runs on the
# profiled host, while the unprivileged viewer stack scrapes it and writes the
# resulting telemetry to InfluxDB. The default URL targets a host-networked
# collector running pcm-sensor-server on port 9738.

[agent]
  interval = "2s"
  round_interval = false
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "0s"
  precision = "1ns"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

[[inputs.http]]
  name_override = "wcckit_pcm_sensor"
  urls = ["${WCCKIT_PCM_SENSOR_URL}"]
  method = "GET"
  timeout = "2s"
  interval = "2s"
  data_format = "json"
  tagexclude = ["url"]
  headers = {"Accept" = "application/json"}
