<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 720">
  <title id="title">WCCKIT pipeline overview workflow</title>
  <desc id="desc">Diagram showing a compute node running a pipeline PID, an SSH link to a researcher laptop viewer stack, a privileged WCCKIT collector Docker container attached to the compute node, local file outputs, and the Pipeline Overview dashboard inside the viewer stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1c2b"/>
      <stop offset="1" stop-color="#18302d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#071018" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#8bd3ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#8ee6ad"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#ffc875"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f2f8ff; }
      .title { font-size: 36px; font-weight: 800; }
      .muted { fill: #bfd1dc; font-size: 21px; }
      .section { fill: #d8e8f2; font-size: 18px; font-weight: 700; letter-spacing: 0; }
      .label { fill: #ffffff; font-size: 25px; font-weight: 800; }
      .small { fill: #dce9ef; font-size: 18px; }
      .tiny { fill: #cbdbe4; font-size: 15px; }
      .box { rx: 14; stroke-width: 2; filter: url(#shadow); }
      .compute { fill: #26384a; stroke: #73c8ff; }
      .tunnel { fill: #243b35; stroke: #8ee6ad; }
      .laptop { fill: #283b56; stroke: #8bd3ff; }
      .collector { fill: #2c4538; stroke: #8ee6ad; }
      .artifact { fill: #4a3a2d; stroke: #ffc875; }
      .dash { fill: #3d3156; stroke: #d6a6ff; }
      .blue-line { stroke: #8bd3ff; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #8ee6ad; stroke-width: 4; fill: none; marker-end: url(#arrow-green); }
      .gold-line { stroke: #ffc875; stroke-width: 4; fill: none; marker-end: url(#arrow-gold); }
      .attach-line { stroke: #8ee6ad; stroke-width: 4; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrow-green); }
      .note { fill: #0c1722; stroke: #405b6f; stroke-width: 1.5; rx: 12; }
      .code { font-family: SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #c9f7d8; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="48" y="58" class="title">WCCKIT pipeline overview workflow</text>
  <text x="48" y="91" class="muted">Attach to a running pipeline PID, preserve raw artifacts, and stream bounded metrics to Grafana</text>

  <text x="70" y="135" class="section">Compute node</text>
  <rect class="box compute" x="60" y="155" width="330" height="170"/>
  <text class="label" x="88" y="202">Pipeline PID</text>
  <text class="small" x="88" y="238">DDFacet, DP3, CASA, wsclean</text>
  <text class="small" x="88" y="268">Python or native pipeline stages</text>
  <text class="small" x="88" y="298">profile until PID exits</text>

  <text x="505" y="135" class="section">SSH link</text>
  <rect class="box tunnel" x="475" y="155" width="330" height="170"/>
  <text class="label" x="503" y="202">Tunnel</text>
  <text class="small" x="503" y="238">compute :18086 to laptop :8086</text>
  <text class="small" x="503" y="268">compute :14040 to laptop :4040</text>
  <text class="tiny" x="503" y="298">opened from the researcher laptop</text>

  <text x="895" y="135" class="section">Researcher laptop</text>
  <rect class="box laptop" x="880" y="155" width="340" height="170"/>
  <text class="label" x="908" y="202">Viewer stack</text>
  <text class="small" x="908" y="238">Grafana :3000</text>
  <text class="small" x="908" y="268">InfluxDB :8086</text>
  <text class="small" x="908" y="298">Pyroscope :4040</text>

  <path class="blue-line" d="M392 240 L472 240"/>
  <path class="blue-line" d="M807 240 L877 240"/>

  <rect class="box collector" x="60" y="410" width="330" height="180"/>
  <text class="label" x="88" y="458">Collector stack</text>
  <text class="small" x="88" y="494">Docker: privileged BCC/perf</text>
  <text class="small" x="88" y="524">Intel PCM or AMD μProf</text>
  <text class="small" x="88" y="554">memory, I/O, app runtime</text>

  <rect class="box artifact" x="475" y="410" width="300" height="180"/>
  <text class="label" x="503" y="458">File Outputs</text>
  <text class="small" x="503" y="494">runs/&lt;run_id&gt;/manifest.json</text>
  <text class="small" x="503" y="524">JSONL, CSV, folded stacks</text>
  <text class="small" x="503" y="554">logs, SVGs, influx.lp</text>

  <rect class="box dash" x="880" y="410" width="340" height="180"/>
  <text class="label" x="908" y="458">Pipeline Overview</text>
  <text class="small" x="908" y="494">inside the viewer stack</text>
  <text class="small" x="908" y="524">runtime, CPU, memory, I/O</text>
  <text class="small" x="908" y="554">run markers + collector status</text>

  <path class="attach-line" d="M225 410 L225 328"/>
  <text class="tiny" x="248" y="372">attaches to PID on host</text>

  <path class="gold-line" d="M392 500 L472 500"/>
  <path class="green-line" d="M1050 328 L1050 407"/>
  <text class="tiny" x="1072" y="372">dashboard is a Grafana view</text>

  <rect class="note" x="70" y="675" width="1140" height="32"/>
  <text class="code" x="640" y="696" text-anchor="middle">Docker containers split collection and viewing; Grafana frontend on the researcher laptop.</text>
</svg>
