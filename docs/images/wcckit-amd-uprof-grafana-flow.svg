<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 460">
  <title id="title">AMD μProf to Grafana flow</title>
  <desc id="desc">Diagram showing AMD μProf and AMDuProfPcm running in the WCCKIT collector stack, writing bounded telemetry and artifacts that are ingested into InfluxDB and viewed through the AMD μProf Grafana dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#181729"/>
      <stop offset="1" stop-color="#25352e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#78e0b0"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4fbff; }
      .title { font-size: 34px; font-weight: 800; }
      .muted { fill: #b9c8d6; font-size: 21px; }
      .label { font-size: 25px; font-weight: 800; }
      .small { fill: #dce8f0; font-size: 18px; }
      .box { rx: 16; stroke-width: 2.5; }
      .amd { fill: #432b32; stroke: #ff9f8f; }
      .artifact { fill: #4a3a2d; stroke: #ffc875; }
      .db { fill: #3b2f55; stroke: #d3a5ff; }
      .dash { fill: #263f54; stroke: #73c8ff; }
      .line { stroke: #78e0b0; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .term { fill: #07121f; stroke: #38536a; stroke-width: 1.5; rx: 12; }
      .code { font-family: SFMono-Regular, Consolas, monospace; font-size: 17px; fill: #c8f7d9; }
    </style>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <text x="48" y="58" class="title">AMD μProf live view</text>
  <text x="48" y="91" class="muted">AMD μProf runs with the collector; Grafana stays in the unprivileged viewer stack</text>

  <rect class="box amd" x="55" y="140" width="250" height="120"/>
  <text class="label" x="82" y="183">Collector stack</text>
  <text class="small" x="82" y="218">AMD μProf tools</text>
  <text class="small" x="82" y="246">AMDuProfPcm</text>

  <rect class="box artifact" x="385" y="140" width="250" height="120"/>
  <text class="label" x="412" y="183">WCCKIT parser</text>
  <text class="small" x="412" y="218">CSV and JSONL archive</text>
  <text class="small" x="412" y="246">bounded line protocol</text>

  <rect class="box db" x="715" y="140" width="190" height="120"/>
  <text class="label" x="742" y="183">InfluxDB</text>
  <text class="small" x="742" y="218">bucket: wcckit</text>
  <text class="small" x="742" y="246">metric archive</text>

  <rect class="box dash" x="995" y="140" width="150" height="120"/>
  <text class="label" x="1020" y="183">Grafana</text>
  <text class="small" x="1020" y="218">AMD μProf</text>
  <text class="small" x="1020" y="246">dashboard</text>

  <path class="line" d="M305 200 L382 200"/>
  <path class="line" d="M635 200 L712 200"/>
  <path class="line" d="M905 200 L992 200"/>

  <rect class="term" x="70" y="320" width="1060" height="78"/>
  <text class="code" x="600" y="353" text-anchor="middle">AMDuProfPcm records CPU, memory, power, and roofline telemetry in the collector stack.</text>
  <text class="code" x="600" y="381" text-anchor="middle">Artifacts stay on disk; bounded summaries flow to Grafana through InfluxDB.</text>
</svg>
