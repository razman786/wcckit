<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 720">
  <title id="title">WCCKIT pipeline profiling architecture</title>
  <desc id="desc">Diagram showing a researcher laptop running Grafana, a reverse SSH tunnel to a compute node, the WCCKIT collector container attached to a pipeline PID, and local reproducible run artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f1c2b"/>
      <stop offset="1" stop-color="#18302d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#071018" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#8bd3ff"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f2f8ff; }
      .title { font-size: 36px; font-weight: 800; }
      .muted { fill: #bfd1dc; font-size: 21px; }
      .section { fill: #d8e8f2; font-size: 18px; font-weight: 700; letter-spacing: 0; }
      .label { fill: #ffffff; font-size: 25px; font-weight: 800; }
      .small { fill: #dce9ef; font-size: 18px; }
      .tiny { fill: #cbdbe4; font-size: 15px; }
      .box { rx: 14; stroke-width: 2; filter: url(#shadow); }
      .laptop { fill: #283b56; stroke: #8bd3ff; }
      .tunnel { fill: #243b35; stroke: #8ee6ad; }
      .compute { fill: #26384a; stroke: #73c8ff; }
      .collector { fill: #2c4538; stroke: #8ee6ad; }
      .artifact { fill: #4a3a2d; stroke: #ffc875; }
      .dash { fill: #3d3156; stroke: #d6a6ff; }
      .line { stroke: #8bd3ff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .greenline { stroke: #8ee6ad; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .note { fill: #0c1722; stroke: #405b6f; stroke-width: 1.5; rx: 12; }
      .code { font-family: SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #c9f7d8; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="48" y="58" class="title">WCCKIT pipeline overview workflow</text>
  <text x="48" y="91" class="muted">Attach to a running pipeline PID, preserve raw artifacts, and stream bounded metrics to Grafana</text>

  <text x="70" y="135" class="section">Researcher laptop</text>
  <rect class="box laptop" x="60" y="155" width="300" height="170"/>
  <text class="label" x="88" y="202">Viewer stack</text>
  <text class="small" x="88" y="238">Grafana :3000</text>
  <text class="small" x="88" y="268">InfluxDB :8086</text>
  <text class="small" x="88" y="298">Pyroscope :4040</text>

  <text x="465" y="135" class="section">SSH link</text>
  <rect class="box tunnel" x="430" y="155" width="270" height="170"/>
  <text class="label" x="458" y="202">Reverse tunnel</text>
  <text class="small" x="458" y="238">remote :18086 -> laptop :8086</text>
  <text class="small" x="458" y="268">remote :14040 -> laptop :4040</text>
  <text class="tiny" x="458" y="298">opened from the laptop</text>

  <text x="850" y="135" class="section">Compute node</text>
  <rect class="box compute" x="800" y="155" width="360" height="170"/>
  <text class="label" x="828" y="202">Pipeline PID</text>
  <text class="small" x="828" y="238">DDFacet, DP3, CASA, wsclean</text>
  <text class="small" x="828" y="268">Python or native pipeline stages</text>
  <text class="small" x="828" y="298">profile until PID exits</text>

  <rect class="box collector" x="195" y="410" width="330" height="180"/>
  <text class="label" x="225" y="458">Collector container</text>
  <text class="small" x="225" y="494">BCC/eBPF I/O + syscalls</text>
  <text class="small" x="225" y="524">Intel PCM or AMD uProf</text>
  <text class="small" x="225" y="554">process memory + app runtime</text>

  <rect class="box artifact" x="610" y="410" width="285" height="180"/>
  <text class="label" x="638" y="458">runs/&lt;run_id&gt;</text>
  <text class="small" x="638" y="494">manifest.json</text>
  <text class="small" x="638" y="524">JSONL, CSV, folded stacks</text>
  <text class="small" x="638" y="554">logs, SVGs, influx.lp</text>

  <rect class="box dash" x="970" y="410" width="230" height="180"/>
  <text class="label" x="998" y="458">Pipeline Overview</text>
  <text class="small" x="998" y="494">runtime events</text>
  <text class="small" x="998" y="524">CPU, memory, I/O</text>
  <text class="small" x="998" y="554">run markers + status</text>

  <path class="line" d="M800 240 C710 240, 615 240, 703 240" opacity="0"/>
  <path class="greenline" d="M360 240 L427 240"/>
  <path class="greenline" d="M700 240 L797 240"/>
  <path class="line" d="M980 325 C900 375, 640 380, 525 455"/>
  <path class="line" d="M525 500 L607 500"/>
  <path class="greenline" d="M525 540 C665 650, 1010 650, 1085 592"/>

  <rect class="note" x="70" y="635" width="1140" height="46"/>
  <text class="code" x="92" y="664">run-wcckit-pipeline-overview.sh --match DDFacet --pipeline DDFacet --influx-url http://127.0.0.1:18086</text>
</svg>
