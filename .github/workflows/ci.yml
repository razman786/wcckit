name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Non-destructive checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Shell syntax checks
        run: |
          bash -n \
            dockerfiles/bin/install-wcckit-profiler-ubuntu2404.sh \
            dockerfiles/bin/run-wcckit-debug-connection.sh \
            dockerfiles/bin/run-wcckit-profiler.sh \
            dockerfiles/bin/run-wcckit-intel-overview.sh \
            dockerfiles/bin/run-wcckit-amd-overview.sh \
            dockerfiles/bin/run-wcckit-pipeline-profiler.sh \
            dockerfiles/bin/run-wcckit-pipeline-overview.sh \
            dockerfiles/bin/run-wcckit-ssh-tunnel.sh \
            dockerfiles/bin/run-wcckit-amd-roofline.sh \
            dockerfiles/bin/run-wcckit-viewer.sh \
            dockerfiles/profiling/bcc/bin/wcckit_profile_cpu.sh \
            dockerfiles/profiling/pipeline/bin/wcckit_profile_pipeline.sh \
            examples/profiling/profile_python_hotspot.sh \
            opti_disk/config_nvme_queues.sh \
            opti_disk/fio_scripts/run_fio.sh \
            opti_disk/reset_cpu_mode.sh \
            opti_disk/set_cpu_mode.sh \
            opti_disk/set_nvme.sh

      - name: Python compile checks
        run: |
          python3 -m compileall -q examples opti_disk dockerfiles/profiling/pipeline/bin

      - name: Help command checks
        run: |
          dockerfiles/bin/install-wcckit-profiler-ubuntu2404.sh --help
          dockerfiles/bin/run-wcckit-debug-connection.sh --help
          dockerfiles/bin/run-wcckit-profiler.sh --help
          dockerfiles/bin/run-wcckit-intel-overview.sh --help
          dockerfiles/bin/run-wcckit-amd-overview.sh --help
          dockerfiles/bin/run-wcckit-pipeline-profiler.sh --help
          dockerfiles/bin/run-wcckit-pipeline-overview.sh --help
          dockerfiles/bin/run-wcckit-ssh-tunnel.sh --help
          dockerfiles/bin/run-wcckit-amd-roofline.sh --help
          dockerfiles/bin/run-wcckit-viewer.sh --help
          dockerfiles/profiling/bcc/bin/wcckit_profile_cpu.sh --help
          dockerfiles/profiling/pipeline/bin/wcckit_profile_pipeline.sh --help
          examples/profiling/profile_python_hotspot.sh --help
          dockerfiles/bin/install-wcckit-profiler-ubuntu2404.sh --help | grep -q -- '--no-amd-esmi'
          dockerfiles/bin/install-wcckit-profiler-ubuntu2404.sh --help | grep -q 'WCCKIT_INCLUDE_AMD_ESMI'
          dockerfiles/profiling/pipeline/bin/wcckit_profile_pipeline.sh --help | grep -q 'e-smi'

      - name: Grafana dashboard JSON checks
        run: |
          python3 -m json.tool dockerfiles/viewer/influxdb-grafana/grafana/dashboards/wcckit-overview.json >/dev/null
          python3 -m json.tool dockerfiles/viewer/influxdb-grafana/grafana/dashboards/intel-pcm-dashboard.json >/dev/null
          python3 -m json.tool dockerfiles/viewer/influxdb-grafana/grafana/dashboards/amd-uprof-dashboard.json >/dev/null
          python3 -m json.tool dockerfiles/viewer/influxdb-grafana/grafana/dashboards/wcckit-profiles.json >/dev/null

      - name: uflow parser smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python3 dockerfiles/profiling/pipeline/bin/wcckit_parse_uflow.py             --input tests/fixtures/uflow-sample.txt             --jsonl "$tmpdir/app-uflow.jsonl"             --folded "$tmpdir/app-uflow.folded"             --line-protocol "$tmpdir/app-uflow.lp"             --run-id ci-uflow-parser             --pipeline ci             --pid 1234             --language python
          test -s "$tmpdir/app-uflow.jsonl"
          test -s "$tmpdir/app-uflow.folded"
          test -s "$tmpdir/app-uflow.lp"
          grep -q raw_unparsed "$tmpdir/app-uflow.jsonl"
          grep -q wcckit_app_uflow_summary "$tmpdir/app-uflow.lp"
          grep -q parsed_events_total "$tmpdir/app-uflow.lp"
          grep -q entry_events_total=2i "$tmpdir/app-uflow.lp"
          grep -q return_events_total=2i "$tmpdir/app-uflow.lp"

      - name: AMD μProf parser smoke test
        run: |
          tmpdir="$(mktemp -d)"
          python3 dockerfiles/profiling/pipeline/bin/wcckit_parse_amd_uprof_pcm.py \
            --input tests/fixtures/amd-uprof-pcm-sample.csv \
            --jsonl "$tmpdir/amd-uprof-pcm.jsonl" \
            --line-protocol "$tmpdir/amd-uprof-pcm.lp" \
            --run-id ci-amd-parser \
            --pipeline ci \
            --pid 1 \
            --vendor AuthenticAMD
          test -s "$tmpdir/amd-uprof-pcm.jsonl"
          test -s "$tmpdir/amd-uprof-pcm.lp"
          grep -q wcckit_amd_uprof_pcm "$tmpdir/amd-uprof-pcm.lp"

      - name: Application runtime parser smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/app-syscalls.log" <<'EOF'
          In file included from /virtual/main.c:2:
          23 |                 return this_cpu_read_const(const_current_task);
          Failed to enable USDT probe 'function__entry':
          METHOD                                              # CALLS TIME (us)
          write                                                     2  20.00
          read                                                      1   5.50
          EOF
          python3 dockerfiles/profiling/pipeline/bin/wcckit_parse_app_tools.py \
            --tool ucalls \
            --language syscall \
            --pid 1 \
            --input "$tmpdir/app-syscalls.log" \
            --jsonl "$tmpdir/app-syscalls.jsonl" \
            --line-protocol "$tmpdir/app-syscalls.lp" \
            --run-id ci-app-parser \
            --pipeline ci
          test "$(wc -l < "$tmpdir/app-syscalls.jsonl")" -eq 2
          grep -q 'events_total=3i' "$tmpdir/app-syscalls.lp"
          grep -q 'errors_total=1i' "$tmpdir/app-syscalls.lp"
          grep -q 'available=true' "$tmpdir/app-syscalls.lp"

      - name: Python hotspot target smoke test
        run: |
          python3 -X perf examples/profiling/python_hotspot.py \
            --duration 1 \
            --channels 4 \
            --baselines 4 \
            --report-interval 0.2

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Ubuntu profiling base image
        run: |
          docker build \
            -t wcckit/ubuntu-profiling-base:24.04 \
            -f dockerfiles/base/ubuntu-24.04.4/Dockerfile \
            .

      - name: Build BCC profiler image
        run: |
          docker build \
            -t wcckit/bcc-profiler:24.04 \
            -f dockerfiles/profiling/bcc/Dockerfile \
            --build-arg BASE_IMAGE=wcckit/ubuntu-profiling-base:24.04 \
            .

      - name: Build pipeline profiler image
        run: |
          docker build \
            -t wcckit/pipeline-profiler:24.04 \
            -f dockerfiles/profiling/pipeline/Dockerfile \
            --build-arg BASE_IMAGE=wcckit/ubuntu-profiling-base:24.04 \
            --build-arg INCLUDE_AMD_UPROF=0 \
            --build-arg INCLUDE_AMD_ESMI=0 \
            .

      - name: Verify profiler image contents
        run: |
          docker run --rm wcckit/bcc-profiler:24.04 bash -lc '
            set -euo pipefail
            command -v wcckit_profile_cpu.sh
            command -v perf
            command -v cpupower
            command -v bpftool
            command -v turbostat
            command -v x86_energy_perf_policy
            perf --version
            cpupower --version
            wcckit_profile_cpu.sh --help
            test -f /src/bcc/tools/profile.py
            test -f /src/FlameGraph/flamegraph.pl
            test -f /opt/wcckit/bcc-tools-summary.txt
          '

      - name: Verify pipeline profiler image contents
        run: |
          docker run --rm wcckit/pipeline-profiler:24.04 bash -lc '
            set -euo pipefail
            command -v wcckit_profile_pipeline.sh
            command -v wcckit_amd_uprof_roofline.sh
            command -v wcckit_jsonl_to_influx.py
            command -v wcckit_parse_app_tools.py
            command -v wcckit_parse_bpf_io.py
            command -v wcckit_parse_amd_uprof_pcm.py
            command -v wcckit_parse_uflow.py
            command -v wcckit_push_pyroscope.py
            command -v pcm
            command -v pcm-memory
            command -v pcm-power
            command -v pcm-pcie
            command -v pcm-sensor
            command -v pcm-sensor-server
            command -v pythonflow.sh
            command -v pythoncalls.sh
            command -v pythonstat.sh
            command -v perf
            command -v cpupower
            command -v bpftool
            if command -v e_smi_tool >/dev/null 2>&1; then echo 'e_smi_tool should be absent from CI no-e-smi image' >&2; exit 1; fi
            wcckit_profile_pipeline.sh --help | grep -q e-smi
            wcckit_amd_uprof_roofline.sh --help
          '

      - name: Docker compose config check
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose -f dockerfiles/viewer/influxdb-grafana/docker-compose.yml config
          else
            docker-compose -f dockerfiles/viewer/influxdb-grafana/docker-compose.yml config
          fi
