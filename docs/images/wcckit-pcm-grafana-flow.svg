<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 460">
  <title id="title">Intel PCM to Grafana flow</title>
  <desc id="desc">Diagram showing pcm-sensor-server feeding Telegraf, InfluxDB, and the Intel PCM Grafana dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#151a2d"/>
      <stop offset="1" stop-color="#1f2f38"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#74e2b6"/>
    </marker>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4fbff; }
      .title { font-size: 34px; font-weight: 800; }
      .muted { fill: #b9c8d6; font-size: 21px; }
      .label { font-size: 25px; font-weight: 800; }
      .small { fill: #dce8f0; font-size: 18px; }
      .box { rx: 16; stroke-width: 2.5; }
      .intel { fill: #0f3652; stroke: #73c8ff; }
      .bridge { fill: #214336; stroke: #74e2b6; }
      .db { fill: #3b2f55; stroke: #d3a5ff; }
      .dash { fill: #463626; stroke: #ffc878; }
      .line { stroke: #74e2b6; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .term { fill: #07121f; stroke: #38536a; stroke-width: 1.5; rx: 12; }
      .code { font-family: SFMono-Regular, Consolas, monospace; font-size: 17px; fill: #c8f7d9; }
    </style>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Intel PCM live view</text>
  <text x="48" y="91" class="muted">WCCKIT keeps Grafana unprivileged while the collector exposes PCM sensor data</text>

  <rect class="box intel" x="55" y="140" width="250" height="120"/>
  <text class="label" x="82" y="183">Intel host</text>
  <text class="small" x="82" y="218">pcm-sensor-server</text>
  <text class="small" x="82" y="246">:9738/persecond</text>

  <rect class="box bridge" x="395" y="140" width="230" height="120"/>
  <text class="label" x="422" y="183">Telegraf</text>
  <text class="small" x="422" y="218">HTTP JSON scrape</text>
  <text class="small" x="422" y="246">2 second interval</text>

  <rect class="box db" x="715" y="140" width="190" height="120"/>
  <text class="label" x="742" y="183">InfluxDB</text>
  <text class="small" x="742" y="218">bucket: wcckit</text>
  <text class="small" x="742" y="246">metric archive</text>

  <rect class="box dash" x="995" y="140" width="150" height="120"/>
  <text class="label" x="1020" y="183">Grafana</text>
  <text class="small" x="1020" y="218">Intel PCM</text>
  <text class="small" x="1020" y="246">dashboard</text>

  <path class="line" d="M305 200 L392 200"/>
  <path class="line" d="M625 200 L712 200"/>
  <path class="line" d="M905 200 L992 200"/>

  <rect class="term" x="70" y="320" width="1060" height="78"/>
  <text class="code" x="95" y="353">WCCKIT_PCM_SENSOR_URL=http://target-host:9738/persecond/ dockerfiles/bin/run-wcckit-viewer.sh</text>
  <text class="code" x="95" y="381">dockerfiles/bin/run-wcckit-pipeline-profiler.sh --pid &lt;PID&gt; --pipeline DDFacet --language python</text>
</svg>
